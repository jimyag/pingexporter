name: Checks

on:
  push:
    branches: ['**']
  merge_group:
  pull_request:
  workflow_call:

permissions:
  pull-requests: read
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          only-new-issues: true
          args: ./...
      - name: Unit tests
        run: go test -race ./...
      - name: DNS and metrics integration test
        run: |
          go test -c -race -tags=integration -o "$RUNNER_TEMP/pingexporter-integration.test" .
          sudo "$RUNNER_TEMP/pingexporter-integration.test" -test.v -test.timeout=90s
      - name: Build
        run: go build ./...
